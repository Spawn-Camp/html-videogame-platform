<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BOUNCERS — Pelotas Locas</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ===== NES PIXEL ART PALETTE =====
   Black   #0d0d0d
   Dark    #1a1a2e
   Navy    #16213e
   Red     #e02020
   Blue    #2060e0
   Green   #20a020
   Yellow  #e0c000
   White   #e8e8e8
   Gray    #888888
================================== */
:root {
  --black:  #0d0d0d;
  --dark:   #1a1a2e;
  --navy:   #16213e;
  --red:    #e02020;
  --blue:   #2060e0;
  --green:  #20a020;
  --yellow: #e0c000;
  --white:  #e8e8e8;
  --gray:   #888888;
  --px: 3px; /* pixel unit */
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
* { image-rendering: pixelated; }

body {
  background: var(--black);
  font-family: 'Press Start 2P', monospace;
  color: var(--white);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
}

/* CRT scanlines overlay */
body::after {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 999;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.18) 2px,
    rgba(0,0,0,0.18) 4px
  );
}

/* Pixel border mixin via box-shadow */
.px-box {
  border: 3px solid var(--white);
  box-shadow:
    -3px 0 0 var(--black),
     3px 0 0 var(--black),
     0 -3px 0 var(--black),
     0  3px 0 var(--black),
    -3px -3px 0 var(--black),
     3px -3px 0 var(--black),
    -3px  3px 0 var(--black),
     3px  3px 0 var(--black);
}

/* ---- SCREENS ---- */
.screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1.6rem; padding: 2rem; text-align: center;
}
.screen.hidden { display: none; }
#titleScreen {
  background: var(--dark);
  background-image:
    linear-gradient(var(--navy) 1px, transparent 1px),
    linear-gradient(90deg, var(--navy) 1px, transparent 1px);
  background-size: 32px 32px;
}

.game-title {
  font-size: clamp(1.4rem, 5vw, 2.8rem);
  color: var(--yellow);
  text-shadow:
    3px 3px 0 #806000,
    6px 6px 0 #403000;
  letter-spacing: .05em;
  line-height: 1.4;
}
.game-subtitle {
  font-size: .45rem;
  color: var(--gray);
  letter-spacing: .15em;
  line-height: 2;
}

/* Buttons */
.btn-play {
  font-family: 'Press Start 2P', monospace;
  font-size: .75rem;
  padding: .7rem 1.6rem;
  background: var(--red);
  color: var(--white);
  border: 3px solid var(--white);
  cursor: pointer;
  letter-spacing: .1em;
  text-transform: uppercase;
  box-shadow: 4px 4px 0 #600000;
  transition: none;
  image-rendering: pixelated;
}
.btn-play:hover  {
  background: #ff4040;
  box-shadow: 4px 4px 0 #800000;
}
.btn-play:active {
  transform: translate(4px, 4px);
  box-shadow: none;
}

.controls-hint {
  font-size: .32rem;
  color: var(--gray);
  letter-spacing: .1em;
  line-height: 2;
}

/* ---- END SCREEN ---- */
#endScreen {
  background: rgba(0,0,0,.92);
}
.end-title {
  font-size: clamp(1rem, 3vw, 1.8rem);
  color: var(--yellow);
  text-shadow: 3px 3px 0 #806000;
  letter-spacing: .1em;
  animation: endFlash .6s steps(1) infinite;
}
@keyframes endFlash {
  0%,49%  { color: var(--yellow); }
  50%,100% { color: var(--white); }
}
.winner-ball {
  width: 64px; height: 64px;
  margin: 0 auto;
  image-rendering: pixelated;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem;
  animation: winnerBounce .4s steps(2) infinite alternate;
}
@keyframes winnerBounce {
  from { transform: translateY(0); }
  to   { transform: translateY(-8px); }
}
.winner-text {
  font-size: .8rem;
  color: var(--white);
  letter-spacing: .05em;
}
.score-table { display: flex; flex-direction: column; gap: .5rem; min-width: 260px; }
.score-row {
  display: flex; align-items: center; gap: .7rem;
  background: var(--navy);
  border: 2px solid var(--gray);
  padding: .5rem .8rem;
}
.score-ball-sm {
  width: 20px; height: 20px;
  flex-shrink: 0;
  image-rendering: pixelated;
}
.score-name { flex: 1; font-size: .38rem; color: var(--white); }
.score-pts  { font-size: .45rem; color: var(--yellow); }

/* ---- HUD ---- */
#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: .5rem .8rem;
  background: var(--black);
  border-bottom: 3px solid var(--gray);
  pointer-events: none;
}
.hud-player { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 80px; }
.hud-name {
  font-size: .38rem;
  letter-spacing: .05em;
}
.hud-status { font-size: .3rem; color: var(--gray); letter-spacing: .05em; }
.hud-status.out { color: var(--red); }
.hud-wins { font-size: .32rem; letter-spacing: .05em; min-height: .38rem; }

/* Pixel momentum bar */
.momentum-bar-wrap {
  width: 64px; height: 6px;
  background: var(--black);
  border: 2px solid var(--gray);
  image-rendering: pixelated;
  overflow: hidden;
}
.momentum-bar-fill {
  height: 100%;
  background: var(--yellow);
  /* No transition — step updates look more pixel */
  transition: none;
  image-rendering: pixelated;
}

.effect-bar {
  display: flex; gap: 3px; flex-wrap: wrap; justify-content: center;
  min-height: 14px;
}
.effect-pill {
  font-size: .22rem;
  border: 2px solid rgba(255,255,255,.4);
  padding: 1px 4px;
  letter-spacing: .03em;
  display: flex; align-items: center; gap: 2px;
}
.effect-pill.expiring {
  animation: blink .25s steps(1) infinite;
}

.hud-center { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.timer-display {
  font-size: 1.1rem;
  color: var(--white);
  letter-spacing: .1em;
}
.timer-display.urgent {
  color: var(--red);
  animation: blink .3s steps(1) infinite;
}
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
.round-label { font-size: .3rem; color: var(--gray); letter-spacing: .2em; }

/* ---- CANVAS ---- */
#gameCanvas {
  position: relative; z-index: 1; display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* ---- TOASTS ---- */
.pwup-toast {
  position: fixed; z-index: 200;
  font-family: 'Press Start 2P', monospace;
  font-size: .5rem;
  background: var(--black);
  border: 3px solid var(--yellow);
  padding: .4rem .8rem;
  pointer-events: none;
  letter-spacing: .05em;
  animation: toastAnim 1.8s steps(1) forwards;
}
@keyframes toastAnim {
  0%   { opacity:0; transform:translateY(0); }
  10%  { opacity:1; transform:translateY(-12px); }
  80%  { opacity:1; transform:translateY(-20px); }
  100% { opacity:0; transform:translateY(-32px); }
}

#countdownOverlay {
  position: fixed; inset: 0; z-index: 90;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.55);
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(4rem, 15vw, 9rem);
  color: var(--yellow);
  text-shadow: 6px 6px 0 #604000;
  letter-spacing: .1em;
  pointer-events: none;
}
#countdownOverlay.hidden { display: none; }

/* ---- ARENA SELECTOR ---- */
.arena-select {
  display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center;
}
.arena-card {
  background: var(--navy);
  border: 3px solid var(--gray);
  padding: .5rem .7rem;
  cursor: pointer;
  min-width: 80px;
  text-align: center;
  position: relative;
}
.arena-card.selected { border-color: var(--yellow); background: #1a1600; }
.arena-card.selected::after { content: "▶"; position:absolute; top:3px; right:5px; font-size:.4rem; color:var(--yellow); }
.arena-thumb {
  width: 60px; height: 60px;
  margin: 0 auto .3rem;
  border-radius: 50%;
  background: #16213e;
  position: relative;
  overflow: hidden;
  border: 2px solid #333;
}
.arena-name { font-size: .32rem; color: var(--white); letter-spacing: .05em; }

/* ---- PLAYER SETUP GRID ---- */
.setup-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: .6rem;
  width: 100%;
  max-width: 460px;
}
.setup-card {
  background: #0d0d1a;
  border: 3px solid #333;
  padding: .6rem;
  display: flex; flex-direction: column; align-items: center; gap: .4rem;
  position: relative;
  transition: border-color .15s;
}
.setup-card.inactive { opacity: .35; }
.setup-card.inactive .setup-toggle { border-color: #444; color: #444; }
.setup-card .setup-toggle {
  position: absolute; top: 4px; right: 6px;
  font-size: .3rem; color: var(--yellow); cursor: pointer;
  border: 1px solid var(--yellow); padding: 1px 4px;
}
.setup-card.inactive .setup-toggle { color: #555; border-color: #555; }

/* Pixel ball preview (canvas) */
.player-ball-canvas {
  image-rendering: pixelated;
  display: block;
}

/* Name input */
.setup-name {
  font-family: 'Press Start 2P', monospace;
  font-size: .38rem;
  background: #000;
  border: 2px solid #444;
  color: var(--white);
  padding: .28rem .35rem;
  width: 90px;
  text-align: center;
  letter-spacing: .05em;
}
.setup-name:focus { outline: none; }
.setup-name:disabled { opacity: .3; }

/* Color swatches */
.swatch-row {
  display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
}
.swatch {
  width: 16px; height: 16px;
  cursor: pointer;
  border: 2px solid transparent;
  flex-shrink: 0;
}
.swatch.chosen { border-color: #fff; transform: scale(1.25); }
.swatch.disabled { cursor: default; opacity: .3; }

/* Keys hint */
.setup-keys { font-size: .28rem; color: #555; letter-spacing: .04em; }
.is-mobile .setup-keys { display: none; }

.section-label {
  font-size: .35rem; color: var(--gray); letter-spacing: .15em; margin-bottom: .1rem;
}

/* ---- POWERUP LEGEND ---- */
.legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: .35rem;
  max-width: 420px;
}
.legend-item {
  display: flex; align-items: center; gap: .25rem;
  background: #0d0d1a; border: 2px solid #333;
  padding: .2rem .4rem;
}
.legend-box {
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Press Start 2P', monospace;
  font-size: .28rem;
  font-weight: bold;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.15);
}
.legend-text {
  font-size: .26rem;
  color: #aaa;
  letter-spacing: .04em;
  white-space: nowrap;
}

/* ---- DEVICE-SPECIFIC VISIBILITY ---- */
/* Desktop: hide joystick zones always */
.is-desktop .joystick-zone { display: none !important; }

/* Mobile: hide keyboard hints */

.is-mobile .btn-play     { font-size: .65rem; padding: .8rem 1.8rem; }
.is-mobile .game-title   { font-size: clamp(1rem, 7vw, 2rem); }
.is-mobile .game-subtitle{ font-size: .38rem; }

/* Mobile: hint replaced by touch hint */
.is-mobile .mobile-hint  { display: block; }
.mobile-hint {
  display: none;
  font-size: .32rem;
  color: var(--gray);
  letter-spacing: .08em;
  line-height: 2;
  text-align: center;
}

/* ---- TOUCH JOYSTICKS ---- */
.joystick-zone {
  position: fixed;
  width: 130px; height: 130px;
  z-index: 60;
  pointer-events: all;
  touch-action: none;
  display: none; /* shown only during gameplay */
}
.joystick-zone.active { display: block; }
.joystick-base {
  width: 100%; height: 100%;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.35);
  position: relative;
}
.joystick-thumb {
  position: absolute;
  width: 48px; height: 48px;
  border-radius: 0; /* pixel square */
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.joystick-label {
  position: absolute;
  top: -22px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Press Start 2P', monospace;
  font-size: .32rem;
  letter-spacing: .05em;
  white-space: nowrap;
}
/* Corner positions */
.joystick-zone[data-corner="0"] { bottom: 16px; left: 16px; }
.joystick-zone[data-corner="1"] { bottom: 16px; right: 16px; }
.joystick-zone[data-corner="2"] { top: 60px; left: 16px; }
.joystick-zone[data-corner="3"] { top: 60px; right: 16px; }
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div class="screen" id="titleScreen" style="gap:.9rem; overflow-y:auto; padding:1rem;">
  <div class="game-title">BOUNCERS!</div>

  <div class="section-label">JUGADORES</div>
  <div class="setup-grid" id="setupGrid"></div>

  <div class="section-label">ARENA</div>
  <div class="arena-select" id="arenaSelect"></div>

  <div class="section-label">POWERUPS</div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-box" style="background:#a08000;color:#ffff00;">T</div>
      <div class="legend-text">TURBO</div>
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#225588;color:#66ccff;">S</div>
      <div class="legend-text">ESCUDO</div>
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#882288;color:#ff66ff;">G</div>
      <div class="legend-text">GIGANTE</div>
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#884444;color:#ffaaaa;">M</div>
      <div class="legend-text">MINI</div>
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#224466;color:#aaddff;">F</div>
      <div class="legend-text">HIELO</div>
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#333;color:#ffdd44;font-size:.22rem;">SD</div>
      <div class="legend-text">MUERTE SÚBITA 30s</div>
    </div>
  </div>

  <button class="btn-play" id="btnStart">PLAYER START</button>
  <div class="controls-hint">CLICK JUGADOR PARA ACTIVAR · AI = CPU · FUERA DEL RING=KO</div>
  <div class="mobile-hint">PULSA JUGADOR PARA ACTIVAR · AI = CPU · JOYSTICK EN ESQUINAS</div>
</div>

<!-- END SCREEN -->
<div class="screen hidden" id="endScreen">
  <div class="end-title">★ GAME OVER ★</div>
  <div class="winner-ball" id="winnerBall"></div>
  <div class="winner-text" id="winnerText"></div>
  <div class="score-table" id="scoreTable"></div>
  <div style="display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;">
    <button class="btn-play" id="btnRematch" style="background:var(--blue);box-shadow:4px 4px 0 #001466;">REVANCHA</button>
    <button class="btn-play" id="btnRestart" style="background:#444;box-shadow:4px 4px 0 #111;font-size:.5rem;">MENÚ</button>
  </div>
</div>

<div id="hud" style="display:none;"></div>
<div class="hidden" id="countdownOverlay"></div>
<div class="joystick-zone" id="joy0" data-corner="0"></div>
<div class="joystick-zone" id="joy1" data-corner="1"></div>
<div class="joystick-zone" id="joy2" data-corner="2"></div>
<div class="joystick-zone" id="joy3" data-corner="3"></div>
<canvas id="gameCanvas" style="touch-action:none;"></canvas>

<script>
'use strict';

/* ============================================================
   DEVICE DETECTION
   ============================================================ */
var isMobile = ('ontouchstart' in window) ||
               (navigator.maxTouchPoints > 0) ||
               /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

document.documentElement.classList.add(isMobile ? 'is-mobile' : 'is-desktop');

/* ============================================================
   CONSTANTS
   ============================================================ */
// Player color palette options
var COLOR_PALETTES = [
  { color:'#ff2222', dark:'#880000', light:'#ff8888' },
  { color:'#2288ff', dark:'#002288', light:'#88bbff' },
  { color:'#08ff08', dark:'#006600', light:'#88ff88' },
  { color:'#ffcc00', dark:'#886600', light:'#ffee88' },
  { color:'#ff44cc', dark:'#880066', light:'#ffaaee' },
  { color:'#ff8800', dark:'#884400', light:'#ffcc88' },
  { color:'#00cccc', dark:'#006666', light:'#88eeee' },
  { color:'#cc44ff', dark:'#660088', light:'#ee88ff' },
];

var CFGS = [
  { name:'P1', colorIdx:0, color:'#ff2222', dark:'#880000', light:'#ff8888',
    keys:{ up:'w', down:'s', left:'a', right:'d' } },
  { name:'P2', colorIdx:1, color:'#2288ff', dark:'#002288', light:'#88bbff',
    keys:{ up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight' } },
  { name:'P3', colorIdx:2, color:'#08ff08', dark:'#006600', light:'#88ff88',
    keys:{ up:'i', down:'k', left:'j', right:'l' } },
  { name:'P4', colorIdx:3, color:'#ffcc00', dark:'#886600', light:'#ffee88',
    keys:{ up:'8', down:'5', left:'4', right:'6' } },
];
// Track wins per CFGS slot across rematches
var cfgWins = [0, 0, 0, 0];

// Arena definitions: id, name, static walls (relative to arenaR, -1..1 coords)
// Each wall: { x, y, w, h } in arenaR units
var ARENAS = [
  {
    id: 0, name: 'RING',
    walls: [],
    floorColor: ['#16213e','#1a1a2e'],
    // spawn at corners: evenly around ring edge
    spawnAngles: [45, 135, 225, 315],
    spawnDist:   0.62,
  },
  {
    id: 1, name: 'BUNKERS',
    // 4 L-shaped bunkers in each quadrant, players spawn in the open diagonals
    walls: [
      // top-left bunker
      { x:-0.70, y:-0.70, w:0.28, h:0.12 },
      { x:-0.70, y:-0.70, w:0.12, h:0.28 },
      // top-right bunker
      { x: 0.42, y:-0.70, w:0.28, h:0.12 },
      { x: 0.58, y:-0.70, w:0.12, h:0.28 },
      // bottom-left bunker
      { x:-0.70, y: 0.58, w:0.28, h:0.12 },
      { x:-0.70, y: 0.42, w:0.12, h:0.28 },
      // bottom-right bunker
      { x: 0.42, y: 0.58, w:0.28, h:0.12 },
      { x: 0.58, y: 0.42, w:0.12, h:0.28 },
    ],
    floorColor: ['#0e1a2e','#131f38'],
    // spawn in center quadrants between bunkers
    spawnAngles: [45, 135, 225, 315],
    spawnDist:   0.62,
  },
  {
    id: 2, name: 'TORRE',
    // No walls — single large static bumper in center acts as the obstacle
    walls: [],
    floorColor: ['#1a0e0e','#261212'],
    spawnAngles: [45, 135, 225, 315],
    spawnDist:   0.62,
    staticBumpers: true,
  },
  {
    id: 3, name: 'MURO',
    // single wide wall across middle with two gaps, plus two side pillars
    walls: [
      { x:-0.78, y:-0.09, w:0.34, h:0.18 },  // left wall
      { x: 0.44, y:-0.09, w:0.34, h:0.18 },  // right wall
      // gaps in center-left and center-right (no wall there)
      { x:-0.08, y:-0.09, w:0.16, h:0.18 },  // center divider
      // two pillars top and bottom
      { x:-0.09, y:-0.68, w:0.18, h:0.20 },
      { x:-0.09, y: 0.48, w:0.18, h:0.20 },
    ],
    floorColor: ['#0e1a14','#13261c'],
    // spawn left half vs right half
    spawnAngles: [45, 135, 225, 315],
    spawnDist:   0.62,
  },
  {
    id: 4, name: 'ORBITA',
    walls: [],
    floorColor: ['#0e0e1a','#13131f'],
    spawnAngles: [45, 135, 225, 315],
    spawnDist:   0.38,
    orbitingWall: true,
  },
];

var selectedArenaId = 0;
var staticWalls = [];  // computed at game start in arenaR units -> pixels
var orbitAngle  = 0;   // orbital angle in radians, advances each frame

var BALL_R          = 20;
var ROUND_TIME      = 90;
var ACCEL           = 0.38;
var MOM_BUILD       = 0.028;
var MOM_DECAY_IDLE  = 0.055;
var MOM_DECAY_TURN  = 0.10;
var MAX_MOMENTUM    = 1.0;
var MAX_SPEED_BASE  = 4.5;
var MAX_SPEED_FULL  = 11.0;
var FRICTION        = 0.89;

var PWUPS = [
  { type:'turbo',  symbol:'T', color:'#ffff00', label:'¡TURBO!',   duration:4000 },
  { type:'shield', symbol:'S', color:'#66ccff', label:'¡ESCUDO!',  duration:5000 },
  { type:'giant',  symbol:'G', color:'#ff66ff', label:'¡GIGANTE!', duration:4000 },
  { type:'tiny',   symbol:'M', color:'#ffaaaa', label:'¡MINI!',    duration:4000 },
  { type:'freeze', symbol:'F', color:'#aaddff', label:'¡HIELO!',   duration:3000 },
];

/* ============================================================
   STATE
   ============================================================ */
var canvas = document.getElementById('gameCanvas');
var ctx    = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
var W, H, arenaX, arenaY, arenaR;

var players   = [];
var obstacles = [];
var powerups  = [];
var particles = [];
var keys      = {};
var gameRunning = false;
var paused      = false;
var timer       = ROUND_TIME;
var timerInterval  = null;
var pwupInterval   = null;
var animId         = null;
var activeIdxs     = [0, 1];
var suddenDeath    = false;

var sdArenaR       = 0;

/* ============================================================
   RESIZE
   ============================================================ */
function resizeCanvas() {
  var size = Math.min(window.innerWidth - 10, window.innerHeight - 90);
  W = canvas.width  = size;
  H = canvas.height = size;
  arenaX = size / 2;
  arenaY = size / 2;
  arenaR = size * 0.48;
}

window.addEventListener('resize', function() {
  if (gameRunning) resizeCanvas();
});

/* ============================================================
   PLAYER SELECT UI
   ============================================================ */
// Which player slots are active (0,1 always on)
var activeSlots = [true, true, false, false];
var aiSlots = new Set();
var KEYS_LABELS = ['W A S D', '↑ ↓ ← →', 'I J K L', '4 5 6 8'];

function drawBallCanvas(canvas, color, dark, light) {
  var c = canvas.getContext('2d');
  var r = canvas.width / 2;
  c.clearRect(0, 0, canvas.width, canvas.height);

  // pixel ball: square with cut corners
  c.fillStyle = color;
  c.fillRect(r*0.3, 0,    r*1.4, r*2);
  c.fillRect(0,    r*0.3, r*2,   r*1.4);

  // highlight top-left
  c.fillStyle = light;
  c.fillRect(r*0.3, r*0.05, r*1.0, r*0.22);
  c.fillRect(r*0.05, r*0.3, r*0.22, r*0.9);

  // shadow bottom-right
  c.fillStyle = dark;
  c.fillRect(r*0.7, r*1.72, r*1.0, r*0.23);
  c.fillRect(r*1.72, r*0.7, r*0.23, r*0.9);

  // eyes
  c.fillStyle = '#fff';
  c.fillRect(r*0.55, r*0.55, r*0.28, r*0.28);
  c.fillRect(r*1.18, r*0.55, r*0.28, r*0.28);
  c.fillStyle = '#000';
  c.fillRect(r*0.65, r*0.65, r*0.14, r*0.14);
  c.fillRect(r*1.28, r*0.65, r*0.14, r*0.14);
}

function buildSetupGrid() {
  var grid = document.getElementById('setupGrid');
  grid.innerHTML = '';

  CFGS.forEach(function(cfg, idx) {
    var active = activeSlots[idx];

    var card = document.createElement('div');
    card.className = 'setup-card' + (active ? '' : ' inactive');
    card.style.borderColor = active ? cfg.color : '#333';

    // Toggle button (P3/P4 only)
    if (idx >= 2) {
      var tog = document.createElement('div');
      tog.className = 'setup-toggle';
      tog.textContent = active ? 'ON' : 'OFF';
      tog.addEventListener('click', function() {
        activeSlots[idx] = !activeSlots[idx];
        // Can't disable if AI was set — also sync aiSlots
        if (!activeSlots[idx]) aiSlots.delete(idx);
        buildSetupGrid();
        renderArenaSelect(); // re-render so previews stay fresh
      });
      card.appendChild(tog);
    }

    // Pixel ball canvas
    var canvas = document.createElement('canvas');
    canvas.width = 44; canvas.height = 44;
    canvas.className = 'player-ball-canvas';
    drawBallCanvas(canvas, cfg.color, cfg.dark, cfg.light);
    card.appendChild(canvas);

    // Name input
    var inp = document.createElement('input');
    inp.type = 'text'; inp.maxLength = 6;
    inp.className = 'setup-name';
    inp.value = cfg.name;
    inp.disabled = !active;
    inp.style.borderColor = active ? cfg.color : '#333';
    inp.addEventListener('input', function() {
      cfg.name = (inp.value || ('P' + (idx+1))).toUpperCase();
    });
    card.appendChild(inp);

    // Color swatches
    var row = document.createElement('div');
    row.className = 'swatch-row';

    // Track which colors are already taken by other active players
    COLOR_PALETTES.forEach(function(pal, ci) {
      var takenByOther = CFGS.some(function(c2, i2) {
        return i2 !== idx && activeSlots[i2] && c2.colorIdx === ci;
      });
      var sw = document.createElement('div');
      sw.className = 'swatch' + (cfg.colorIdx === ci ? ' chosen' : '') + (takenByOther ? ' disabled' : '');
      sw.style.background = pal.color;
      sw.style.borderColor = cfg.colorIdx === ci ? '#fff' : 'transparent';

      sw.addEventListener('click', function() {
        if (takenByOther || !active) return;
        // If another player (even inactive) has this colorIdx, give them the color we are vacating
        var oldIdx = cfg.colorIdx;
        CFGS.forEach(function(other, oi) {
          if (oi !== idx && other.colorIdx === ci) {
            // Assign them a free color slot
            for (var fi = 0; fi < COLOR_PALETTES.length; fi++) {
              var taken = CFGS.some(function(x, xi) { return xi !== oi && x.colorIdx === fi; });
              if (!taken) {
                other.colorIdx = fi;
                other.color = COLOR_PALETTES[fi].color;
                other.dark  = COLOR_PALETTES[fi].dark;
                other.light = COLOR_PALETTES[fi].light;
                break;
              }
            }
          }
        });
        cfg.colorIdx = ci;
        cfg.color = pal.color; cfg.dark = pal.dark; cfg.light = pal.light;
        buildSetupGrid();
      });
      row.appendChild(sw);
    });
    card.appendChild(row);

    // Keys hint
    var keys = document.createElement('div');
    keys.className = 'setup-keys';
    keys.textContent = KEYS_LABELS[idx];
    card.appendChild(keys);

    // AI toggle
    var aiRow = document.createElement('div');
    aiRow.style.cssText = 'display:flex;align-items:center;gap:5px;';
    var aiBtn = document.createElement('div');
    aiBtn.style.cssText = 'font-size:.28rem;padding:2px 6px;border:1px solid ' +
      (aiSlots.has(idx) ? 'var(--yellow)' : '#444') + ';cursor:pointer;color:' +
      (aiSlots.has(idx) ? 'var(--yellow)' : '#555') + ';background:#111;';
    aiBtn.textContent = 'CPU';
    if (!active) aiBtn.style.opacity = '.3';
    aiBtn.addEventListener('click', function() {
      if (!active) return;
      if (aiSlots.has(idx)) aiSlots.delete(idx);
      else aiSlots.add(idx);
      buildSetupGrid();
    });
    aiRow.appendChild(aiBtn);
    card.appendChild(aiRow);

    grid.appendChild(card);
  });

  // Sync activeIdxs from activeSlots
  activeIdxs = [];
  for (var i = 0; i < 4; i++) { if (activeSlots[i]) activeIdxs.push(i); }
}

// Build arena selector
function renderArenaSelect() {
  var sel = document.getElementById('arenaSelect');
  sel.innerHTML = '';
  ARENAS.forEach(function(arena) {
    var card = document.createElement('div');
    card.className = 'arena-card' + (arena.id === selectedArenaId ? ' selected' : '');
    // Mini preview canvas
    var thumb = document.createElement('div');
    thumb.className = 'arena-thumb';
    var mini = document.createElement('canvas');
    mini.width = 60; mini.height = 60;
    var mc = mini.getContext('2d');
    mc.fillStyle = arena.floorColor[0];
    mc.beginPath(); mc.arc(30,30,28,0,Math.PI*2); mc.fill();
    mc.fillStyle = arena.floorColor[1] || '#333';
    arena.walls.forEach(function(w) {
      var wx = 30 + w.x * 28, wy = 30 + w.y * 28;
      var ww = w.w * 28,      wh = w.h * 28;
      mc.fillRect(wx, wy, ww, wh);
    });
    mc.strokeStyle = '#888'; mc.lineWidth = 2;
    mc.beginPath(); mc.arc(30,30,28,0,Math.PI*2); mc.stroke();
    thumb.appendChild(mini);

    var nm = document.createElement('div');
    nm.className = 'arena-name'; nm.textContent = arena.name;

    card.appendChild(thumb); card.appendChild(nm);
    card.addEventListener('click', function() {
      selectedArenaId = arena.id;
      sel.querySelectorAll('.arena-card').forEach(function(c) { c.classList.remove('selected'); });
      card.classList.add('selected');
    });
    sel.appendChild(card);
  });
}
