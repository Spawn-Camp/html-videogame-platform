<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometry Dash HTML5 - Retro Edition</title>
<style>
  :root{
    --bg-deep:#0d0221; --bg-mid:#1a0b3d; --grid:#3a1c71;
    --neon-cyan:#08f7fe; --neon-magenta:#ff2e63; --neon-yellow:#f9c80e;
    --neon-purple:#c77dff; --neon-green:#2dfe54; --fg:#f5f5f5;
  }
  html,body{margin:0;height:100%;background:var(--bg-deep);overflow:hidden;font-family:'Courier New',monospace;color:var(--fg)}
  #wrap{position:relative;width:100vw;height:100vh;margin:0}
  canvas{display:block;width:100%;height:100%;background:var(--bg-mid);image-rendering:pixelated}
  #hud{position:absolute;top:12px;left:10px;font-size:13px;color:var(--neon-cyan);text-shadow:0 0 4px var(--neon-cyan)}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,2,33,0.85);text-align:center}
  .hidden{display:none}
  h1{color:var(--neon-yellow);text-shadow:0 0 10px var(--neon-yellow);letter-spacing:3px;font-size:38px;margin:0 0 20px}
  .btn{background:transparent;border:2px solid var(--neon-cyan);color:var(--neon-cyan);padding:10px 26px;font-family:inherit;font-size:16px;cursor:pointer;text-shadow:0 0 6px var(--neon-cyan);box-shadow:0 0 10px var(--neon-cyan) inset;transition:.15s}
  .btn:hover{background:var(--neon-cyan);color:var(--bg-deep)}
  #deathMsg{color:var(--neon-magenta);text-shadow:0 0 10px var(--neon-magenta);font-size:24px;margin-bottom:16px}
  small{opacity:.6;display:block;margin-top:14px}

  /* ---------- MENÚ: nombre, skins, formas y ranking ---------- */
  #menuOverlay{justify-content:flex-start;overflow-y:auto;padding:36px 16px 28px}
  .menu-scroll{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:640px;margin:0 auto}
  .menu-card,.ranking-card{width:100%;box-sizing:border-box;background:rgba(26,11,61,0.55);border:2px solid var(--neon-cyan);box-shadow:0 0 18px rgba(8,247,254,.35),inset 0 0 24px rgba(8,247,254,.08);padding:22px 24px}
  .brand{text-align:center;margin-bottom:4px}
  .brand h1{margin:0;font-size:30px}
  .brand .subtitle{margin:6px 0 0;font-size:11px;letter-spacing:3px;color:var(--neon-purple);text-shadow:0 0 6px var(--neon-purple)}
  .field-label{display:block;font-size:11px;letter-spacing:2px;color:var(--neon-cyan);margin:18px 0 6px;text-shadow:0 0 4px var(--neon-cyan)}
  .name-input{width:100%;box-sizing:border-box;background:var(--bg-deep);border:2px solid var(--neon-purple);color:var(--fg);font-family:inherit;font-size:16px;letter-spacing:2px;padding:10px 12px;text-transform:uppercase;text-align:center;outline:none}
  .name-input:focus{border-color:var(--neon-cyan);box-shadow:0 0 10px var(--neon-cyan)}
  .tabs{display:flex;margin-top:18px;border:2px solid var(--grid)}
  .tab-btn{flex:1;background:transparent;border:none;color:var(--fg);opacity:.6;font-family:inherit;font-size:12px;letter-spacing:2px;padding:9px 0;cursor:pointer}
  .tab-btn.active{opacity:1;color:var(--neon-yellow);text-shadow:0 0 6px var(--neon-yellow);background:rgba(249,200,14,.08)}
  .tab-panel{padding-top:16px}
  .swatch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .swatch{--sw-color:#08f7fe;display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:2px solid rgba(245,245,245,.25);color:var(--fg);font-family:inherit;font-size:10px;letter-spacing:1px;padding:10px 4px;cursor:pointer}
  .swatch-dot{width:22px;height:22px;background:var(--sw-color);box-shadow:0 0 8px var(--sw-color)}
  .swatch.selected{border-color:var(--sw-color);box-shadow:0 0 10px var(--sw-color)}
  .shape-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .shape-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:2px solid rgba(245,245,245,.25);color:var(--fg);font-family:inherit;font-size:10px;letter-spacing:1px;padding:10px 4px;cursor:pointer}
  .shape-icon{font-size:20px;color:var(--neon-cyan)}
  .shape-item.selected{border-color:var(--neon-cyan);box-shadow:0 0 10px var(--neon-cyan)}
  .shape-item.selected .shape-icon{color:var(--neon-yellow)}
  .play-btn{width:100%;margin-top:20px;font-size:18px}
  .ranking-card h2{margin:0 0 14px;text-align:center;font-size:15px;color:var(--neon-yellow);text-shadow:0 0 8px var(--neon-yellow);letter-spacing:2px}
  .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:16px}
  .podium-item{position:relative;border:2px solid rgba(245,245,245,.3);padding:14px 6px 10px;text-align:center;background:rgba(0,0,0,.3)}
  .podium-item.first{border-color:var(--neon-yellow);box-shadow:0 0 14px rgba(249,200,14,.5);padding-top:26px;order:2}
  .podium-item.second{border-color:var(--neon-cyan);order:1}
  .podium-item.third{border-color:var(--neon-magenta);order:3}
  .crown{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:18px}
  .p-name{font-size:11px;letter-spacing:1px;word-break:break-all}
  .p-score{font-size:20px;font-weight:bold;margin:4px 0}
  .podium-item.first .p-score{color:var(--neon-yellow)}
  .podium-item.second .p-score{color:var(--neon-cyan)}
  .podium-item.third .p-score{color:var(--neon-magenta)}
  .p-date{font-size:9px;opacity:.5}
  .p-empty{opacity:.3;padding:10px 0}
  .board-wrap{max-height:220px;overflow-y:auto;border-top:1px solid rgba(245,245,245,.15)}
  table.board{width:100%;border-collapse:collapse;font-size:12px}
  table.board th{position:sticky;top:0;background:var(--bg-mid);color:var(--neon-purple);text-align:left;padding:6px 4px;font-size:10px;letter-spacing:1px}
  table.board td{padding:5px 4px;border-top:1px solid rgba(245,245,245,.08)}
  .empty-row{text-align:center;opacity:.6;padding:14px 0!important}
  .board-status{text-align:center;font-size:10px;opacity:.6;margin-top:10px;letter-spacing:1px}
  .btn-row{display:flex;gap:12px;margin-top:6px}
  .btn-ghost{border-color:var(--neon-magenta);color:var(--neon-magenta);text-shadow:0 0 6px var(--neon-magenta);box-shadow:0 0 10px var(--neon-magenta) inset}
  .btn-ghost:hover{background:var(--neon-magenta);color:var(--bg-deep)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">Distancia: <span id="dist">0</span>m &nbsp;|&nbsp; Récord: <span id="bestHud">0</span>m &nbsp;|&nbsp; Intentos: <span id="attempts">1</span> &nbsp;|&nbsp; <span id="muteBtn" style="cursor:pointer">🔊</span></div>

  <div id="menuOverlay" class="overlay">
    <div class="menu-scroll">
      <div class="menu-card">
        <div class="brand">
          <h1>GEOMETRY DASH</h1>
          <p class="subtitle">RETRO SYNTHWAVE EDITION — RANKING GLOBAL</p>
        </div>

        <label class="field-label" for="playerName">NOMBRE DE JUGADOR</label>
        <input id="playerName" class="name-input" maxlength="16" placeholder="INVITADO" autocomplete="off">

        <div class="tabs">
          <button type="button" class="tab-btn active" data-tab="skins">◆ SKINS</button>
          <button type="button" class="tab-btn" data-tab="formas">▲ FORMAS</button>
        </div>
        <div class="tab-panel" id="panel-skins">
          <div class="swatch-grid" id="skinGrid"></div>
        </div>
        <div class="tab-panel hidden" id="panel-formas">
          <div class="shape-grid" id="shapeGrid"></div>
        </div>

        <button class="btn play-btn" id="startBtn">▶ JUGAR</button>
        <small>ESPACIO / CLICK = saltar (mantener) &nbsp;|&nbsp; NAVE: controla la altura &nbsp;|&nbsp; ENTER: iniciar</small>
      </div>

      <div class="ranking-card">
        <h2>🏆 HALL OF FAME — TOP 50</h2>
        <div class="podium" id="podium"></div>
        <div class="board-wrap">
          <table class="board">
            <thead><tr><th>#</th><th>JUGADOR</th><th>DIST</th><th>FECHA</th></tr></thead>
            <tbody id="boardBody"></tbody>
          </table>
        </div>
        <div class="board-status" id="boardStatus">Cargando ranking…</div>
      </div>
    </div>
  </div>

  <div id="deathOverlay" class="overlay hidden">
    <div id="deathMsg">💀 GAME OVER</div>
    <div class="btn-row">
      <button class="btn" id="retryBtn">↻ REINTENTAR</button>
      <button class="btn btn-ghost" id="menuFromDeathBtn">🏠 MENÚ</button>
    </div>
  </div>

  <div id="winOverlay" class="overlay hidden">
    <h1 style="color:var(--neon-green);text-shadow:0 0 10px var(--neon-green)">¡NIVEL COMPLETO!</h1>
    <div class="btn-row">
      <button class="btn" id="againBtn">↻ JUGAR DE NUEVO</button>
      <button class="btn btn-ghost" id="menuFromWinBtn">🏠 MENÚ</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
"use strict";

/* ============================================================
   AUDIO — sintetizador procedural con Web Audio API (sin assets)
   ============================================================ */
const AudioEngine = (() => {
  let ctx=null, muted=false, musicOn=false, noiseBuf=null, timerId=null;
  const BPM = 130, STEP_DUR = 60/BPM/2; // corcheas a 130bpm (igual que el JSON de nivel de referencia)
  let nextNoteTime=0, step=0;
  const beatFlashes = []; // tiempos (ctx.currentTime) de cada compás, para sincronizar el flash visual
  function ensure(){
    if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    if(!noiseBuf){ noiseBuf = ctx.createBuffer(1, ctx.sampleRate*0.05, ctx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); }
    return ctx;
  }
  function beep(freq,dur,type='square',vol=0.15,startAt=0){
    if(muted) return; const ac=ensure(), t0=ac.currentTime+startAt;
    const osc=ac.createOscillator(), gain=ac.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(vol,t0); gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(gain).connect(ac.destination); osc.start(t0); osc.stop(t0+dur);
  }
  function noteAt(time,freq,dur,type,vol){
    if(muted||!freq) return; const ac=ensure();
    const osc=ac.createOscillator(), gain=ac.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,time);
    gain.gain.setValueAtTime(vol,time); gain.gain.exponentialRampToValueAtTime(0.0001,time+dur);
    osc.connect(gain).connect(ac.destination); osc.start(time); osc.stop(time+dur);
  }
  function hitAt(time,vol){
    if(muted) return; const ac=ensure();
    const src=ac.createBufferSource(); src.buffer=noiseBuf;
    const gain=ac.createGain(); gain.gain.setValueAtTime(vol,time); gain.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
    src.connect(gain).connect(ac.destination); src.start(time);
  }
  // patrón de 16 pasos (corcheas): bajo, arpegio lead y percusión — estilo chiptune retro
  const BASS = [110,0,110,0,146.8,0,110,0,98,0,98,0,73.4,0,110,0];
  const LEAD = [440,0,554,0,659,0,554,0,392,0,494,0,587,0,494,0];
  function scheduler(){
    const ac=ensure();
    while(nextNoteTime < ac.currentTime+0.12){
      const s = step%16;
      if(BASS[s]) noteAt(nextNoteTime, BASS[s], STEP_DUR*0.9,'square',0.09);
      if(LEAD[s]) noteAt(nextNoteTime, LEAD[s], STEP_DUR*0.5,'triangle',0.045);
      if(s%4===0) hitAt(nextNoteTime, s===0?0.22:0.13);
      if(s%8===0) beatFlashes.push(nextNoteTime);
      nextNoteTime += STEP_DUR; step++;
    }
  }
  return {
    jump: () => beep(520, 0.09, 'square', 0.12),
    land: () => beep(300, 0.05, 'triangle', 0.08),
    die:  () => { beep(140,0.25,'sawtooth',0.18); beep(90,0.3,'sawtooth',0.15,0.05); },
    portal:() => beep(700,0.15,'sine',0.15),
    win:  () => { [0,0.1,0.2].forEach((t,i)=>beep(440+i*220,0.15,'square',0.14,t)); },
    unlock: () => ensure(),
    startMusic(){ if(musicOn) return; musicOn=true; const ac=ensure(); nextNoteTime=ac.currentTime+0.05; step=0; scheduler(); timerId=setInterval(scheduler,25); },
    toggleMute(){ muted=!muted; return muted; },
    isMuted(){ return muted; },
    consumeBeat(nowT){ if(beatFlashes.length && beatFlashes[0]<=nowT){ beatFlashes.shift(); return true; } return false; },
    now(){ return ctx ? ctx.currentTime : 0; }
  };
})();


/* ============================================================
   PARTICLE POOL — object pooling: cero asignaciones en el loop
   ============================================================ */
class ParticlePool{
  constructor(size=120){
    this.pool = Array.from({length:size}, ()=>({active:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:1,color:'#fff',size:3}));
  }
  spawn(x,y,color,count=8,speedMul=1){
    let spawned=0;
    for(const p of this.pool){
      if(p.active) continue;
      p.active=true; p.x=x; p.y=y;
      const ang = Math.random()*Math.PI*2;
      const spd = (60+Math.random()*120)*speedMul;
      p.vx = Math.cos(ang)*spd; p.vy = Math.sin(ang)*spd - 40;
      p.life = 0; p.maxLife = 0.4+Math.random()*0.4;
      p.color = color; p.size = 2+Math.random()*3;
      if(++spawned>=count) break;
    }
  }
  update(dt){
    for(const p of this.pool){
      if(!p.active) continue;
      p.life += dt;
      if(p.life>=p.maxLife){ p.active=false; continue; }
      p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    }
  }
  draw(ctx, camX){
    for(const p of this.pool){
      if(!p.active) continue;
      const a = 1 - p.life/p.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-camX, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }
}
const particles = new ParticlePool();

/* ============================================================
   MENÚ — NOMBRE, SKINS, FORMAS Y RANKING GLOBAL (FIREBASE)
   ============================================================ */
const SKINS = [
  { id:'cyan',    name:'CIAN',     color:'#08f7fe' },
  { id:'magenta', name:'MAGENTA',  color:'#ff2e63' },
  { id:'yellow',  name:'AMARILLO', color:'#f9c80e' },
  { id:'purple',  name:'PÚRPURA',  color:'#c77dff' },
  { id:'green',   name:'VERDE',    color:'#2dfe54' },
  { id:'white',   name:'BLANCO',   color:'#f5f5f5' },
];
const SHAPES = [
  { id:'square',   name:'CUBO',    icon:'■' },
  { id:'circle',   name:'ESFERA',  icon:'●' },
  { id:'triangle', name:'PRISMA',  icon:'▲' },
  { id:'diamond',  name:'CRISTAL', icon:'◆' },
];
const LS_NAME='gj_name', LS_SKIN='gj_skin', LS_SHAPE='gj_shape', LS_BOARD='gj_local_board';
function loadPrefs(){
  let name='', skin='cyan', shape='square';
  try{
    name = localStorage.getItem(LS_NAME) || '';
    skin = localStorage.getItem(LS_SKIN) || 'cyan';
    shape = localStorage.getItem(LS_SHAPE) || 'square';
  }catch(e){}
  return { name, skin, shape };
}
function savePrefs(name, skin, shape){
  try{ localStorage.setItem(LS_NAME,name); localStorage.setItem(LS_SKIN,skin); localStorage.setItem(LS_SHAPE,shape); }catch(e){}
}
const prefs = loadPrefs();
let selectedSkin = prefs.skin, selectedShape = prefs.shape, currentPlayerName = 'INVITADO';

const nameInput = document.getElementById('playerName');
nameInput.value = prefs.name;
nameInput.addEventListener('input', ()=> savePrefs(nameInput.value.trim(), selectedSkin, selectedShape));
nameInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); if(gameState==='menu') startGame(); }
});

function buildSkinGrid(){
  const grid = document.getElementById('skinGrid');
  grid.innerHTML='';
  SKINS.forEach(s=>{
    const el = document.createElement('button');
    el.type='button';
    el.className = 'swatch'+(s.id===selectedSkin?' selected':'');
    el.style.setProperty('--sw-color', s.color);
    el.innerHTML = `<span class="swatch-dot"></span><span class="swatch-label">${s.name}</span>`;
    el.onclick = ()=>{ selectedSkin=s.id; savePrefs(nameInput.value.trim(), selectedSkin, selectedShape); buildSkinGrid(); };
    grid.appendChild(el);
  });
}
function buildShapeGrid(){
  const grid = document.getElementById('shapeGrid');
  grid.innerHTML='';
  SHAPES.forEach(s=>{
    const el = document.createElement('button');
    el.type='button';
    el.className = 'shape-item'+(s.id===selectedShape?' selected':'');
    el.innerHTML = `<span class="shape-icon">${s.icon}</span><span class="shape-label">${s.name}</span>`;
    el.onclick = ()=>{ selectedShape=s.id; savePrefs(nameInput.value.trim(), selectedSkin, selectedShape); buildShapeGrid(); };
    grid.appendChild(el);
  });
}
buildSkinGrid(); buildShapeGrid();

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('panel-skins').classList.toggle('hidden', tab!=='skins');
    document.getElementById('panel-formas').classList.toggle('hidden', tab!=='formas');
  });
});

/* --- Firebase --- */
const firebaseConfig = {
  apiKey: "AIzaSyCsKaYXRXb0bkXQt_JsMC2uZyTX-OM7x3I",
  authDomain: "geometryjum.firebaseapp.com",
  projectId: "geometryjum",
  storageBucket: "geometryjum.firebasestorage.app",
  messagingSenderId: "24881072028",
  appId: "1:24881072028:web:984a8a3fb24a602067ea59",
  measurementId: "G-P4NP81SXF8"
};
const SCORES_COLLECTION = 'geometryRush_scores';
let db=null, dbReady=false;
let unsubscribeScores=null;
try{
  if(window.firebase){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    dbReady = true;
  }
}catch(e){ console.warn('Firebase no disponible, usando ranking local', e); }

function getLocalScores(){
  try{ return JSON.parse(localStorage.getItem(LS_BOARD)||'[]'); }catch(e){ return []; }
}
function saveLocalScore(entry){
  const list = getLocalScores();
  list.push(entry);
  list.sort((a,b)=>b.distance-a.distance);
  try{ localStorage.setItem(LS_BOARD, JSON.stringify(list.slice(0,50))); }catch(e){}
}
async function submitScore(name, distance, skin, shape){
  const safeName = (name||'INVITADO').toUpperCase().slice(0,16);
  if(dbReady){
    try{
      await db.collection(SCORES_COLLECTION).add({
        name:safeName, distance, skin, shape,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(e){
      console.warn('Fallo al guardar en Firebase, guardando localmente', e);
      saveLocalScore({name:safeName, distance, skin, shape, ts:Date.now()});
    }
  } else {
    saveLocalScore({name:safeName, distance, skin, shape, ts:Date.now()});
  }
  refreshBoard();
}
function fmtDate(d){ return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`; }
const boardStatus = document.getElementById('boardStatus');
const podiumEl = document.getElementById('podium');
const boardBody = document.getElementById('boardBody');
function refreshBoard(){
  if(dbReady){
    if(unsubscribeScores) return;
    unsubscribeScores = db.collection(SCORES_COLLECTION)
      .orderBy('distance','desc')
      .limit(50)
      .onSnapshot(snap=>{
      const rows = snap.docs.map(doc=>{
        const v = doc.data();
        return { name:v.name, distance:v.distance, date: v.createdAt && v.createdAt.toDate ? v.createdAt.toDate() : new Date() };
      });
      boardStatus.textContent = '● RANKING GLOBAL — CONECTADO';
      renderBoard(rows);
    }, e=>{
      console.warn('Fallo al cargar el ranking de Firebase, usando ranking local', e);
      unsubscribeScores = null;
      const rows = getLocalScores().map(r=>({name:r.name, distance:r.distance, date:new Date(r.ts)}));
      boardStatus.textContent = '○ SIN CONEXIÓN — MOSTRANDO RANKING LOCAL';
      renderBoard(rows);
    });
    return;
  }
  const rows = getLocalScores().map(r=>({name:r.name, distance:r.distance, date:new Date(r.ts)}));
  boardStatus.textContent = '○ MODO LOCAL — CONFIGURA FIREBASE PARA RANKING GLOBAL';
  renderBoard(rows);
}
function renderBoard(rows){
  podiumEl.innerHTML='';
  [1,0,2].forEach((idx,i)=>{
    const cls=['second','first','third'][i];
    const r = rows[idx];
    const div = document.createElement('div');
    div.className = 'podium-item '+cls;
    div.innerHTML = r
      ? (idx===0?'<div class="crown">👑</div>':'') + `<div class="p-name">${r.name}</div><div class="p-score">${r.distance}</div><div class="p-date">${fmtDate(r.date)}</div>`
      : `<div class="p-empty">—</div>`;
    podiumEl.appendChild(div);
  });
  boardBody.innerHTML = rows.length>3
    ? rows.slice(3).map((r,i)=>`<tr><td>#${i+4}</td><td>${r.name}</td><td>${r.distance}</td><td>${fmtDate(r.date)}</td></tr>`).join('')
    : (rows.length===0 ? `<tr><td colspan="4" class="empty-row">Aún no hay puntuaciones — ¡sé el primero!</td></tr>` : '');
}
refreshBoard();

function backToMenu(){
  document.getElementById('deathOverlay').classList.add('hidden');
  document.getElementById('winOverlay').classList.add('hidden');
  document.getElementById('menuOverlay').classList.remove('hidden');
  gameState='menu';
  refreshBoard();
}

/* ============================================================
   CONFIG FÍSICA (unidades por segundo, no por frame)
   ============================================================ */
const GRAVITY_CUBE = 2600, JUMP_VELOCITY = -820, PAD_VELOCITY = -1100;
const GRAVITY_SHIP = 1500, SHIP_THRUST = -1900, SHIP_MAX_VY = 480;
const SCROLL_SPEED = 420, MAX_DT = 1/30, FIXED_STEP = 1/240;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let groundY = 340;
function resizeCanvas(){
  const oldGround = groundY;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  groundY = canvas.height - 90;
  const delta = groundY - oldGround;
  if(delta){ for(const o of level.objects) o.y += delta; player.y += delta; }
  LOOKAHEAD = Math.max(1300, canvas.width*2.5);
}

/* ============================================================
   NIVEL — Level JSON Schema (bloques, pinchos, pads, portales)
   ============================================================ */
/* Nivel infinito: catálogo de patrones "seguros" (huecos calculados para el
   alcance real del salto: apex≈129px, distancia horizontal máx≈265px, y el
   pad da un arco de ≈355px). Cada patrón deja pista plana al final para que
   siempre haya tiempo de reacción antes del siguiente. */
const JUMP_RANGE = SCROLL_SPEED * (2*Math.abs(JUMP_VELOCITY)/GRAVITY_CUBE); // ≈265px
const PATTERNS = [
  { w:300, objs:[] }, // respiro
  { w:350, objs:[{type:'spike',dx:170,w:30,h:30}] },
  { w:400, objs:[{type:'spike',dx:170,w:30,h:30},{type:'spike',dx:210,w:30,h:30}] },
  { w:380, objs:[{type:'block',dx:170,w:40,h:40}] },
  { w:460, objs:[{type:'block',dx:150,w:40,h:40},{type:'spike',dx:300,w:30,h:30}] },
  { w:480, objs:[{type:'pad',dx:150,w:40,h:14},{type:'spike',dx:270,w:30,h:30},{type:'spike',dx:310,w:30,h:30}] },
  { w:400, objs:[{type:'block',dx:170,w:40,h:90}] },
];
const level = { objects: [] };
let furthestX = 700; // primer tramo inicial en llano, sin obstáculos

function cullBehind(camX){
  level.objects = level.objects.filter(o => o.x + o.w > camX - 300);
}
function spawnChunk(){
  const p = PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
  for(const o of p.objs) level.objects.push({ type:o.type, x:furthestX+o.dx, y:groundY-o.h, w:o.w, h:o.h });
  furthestX += p.w;
}
let LOOKAHEAD = 1300;
for(let i=0;i<6;i++) spawnChunk(); // pre-generar tramo inicial

/* ============================================================
   JUGADOR
   ============================================================ */
const SIZE = 32;
const player = {
  x:150, y:groundY-SIZE, w:SIZE, h:SIZE,
  vy:0, rotation:0, grounded:true, dead:false, holdInput:false,
  mode:'cube', trailTimer:0,
  skin:'cyan', skinColor:'#08f7fe', shape:'square'
};
let camX=0, attempts=1, gameState='menu', beatFlash=0;
const MAX_SPEED = 760;
function currentSpeed(){ return Math.min(MAX_SPEED, SCROLL_SPEED + player.x*0.018); }

function spikeHitbox(o){ const s=o.w*0.1; return {x:o.x+s,y:o.y+s,w:o.w-s*2,h:o.h-s*2}; }
function aabbOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

/* ============================================================
   FÍSICA Y COLISIONES — sub-step fijo, anti-tunneling
   ============================================================ */
function physicsStep(dt){
  if(gameState!=='playing') return;

  const prevBottom = player.y+player.h, prevTop = player.y;
  const wasFalling = player.vy>=0;
  const gravity = player.mode==='ship' ? GRAVITY_SHIP : GRAVITY_CUBE;

  player.vy += gravity*dt;
  if(player.mode==='ship' && player.holdInput) player.vy += SHIP_THRUST*dt;
  if(player.mode==='ship') player.vy = Math.max(-SHIP_MAX_VY, Math.min(SHIP_MAX_VY, player.vy));
  player.y += player.vy*dt;
  player.x += currentSpeed()*dt;

  if(player.mode==='cube'){
    if(player.y+player.h >= groundY){ player.y=groundY-player.h; if(player.vy>200) particles.spawn(player.x-camX+player.w/2, groundY, player.skinColor,4,0.5); player.vy=0; player.grounded=true; }
    else player.grounded=false;
    if(!player.grounded) player.rotation += (Math.PI/2)*(dt/0.35);
  } else {
    if(player.y+player.h>=groundY){ killPlayer(); return; }
    if(player.y<=0){ player.y=0; player.vy=0; }
    player.rotation = Math.max(-0.5, Math.min(0.5, player.vy/SHIP_MAX_VY*0.5));
  }

  if(furthestX - player.x < LOOKAHEAD){ spawnChunk(); cullBehind(player.x-150); }

  for(const o of level.objects){
    if(o.type==='portal_ship' && player.mode!=='ship' && player.x+player.w>=o.x){ player.mode='ship'; AudioEngine.portal(); continue; }
    if(o.type==='portal_cube' && player.mode!=='cube' && player.x+player.w>=o.x){ player.mode='cube'; player.rotation=0; AudioEngine.portal(); continue; }
    if(o.type==='block'){
      if(!aabbOverlap(player,o)) continue;
      const newBottom = player.y+player.h;
      if(player.mode==='cube' && wasFalling && prevBottom<=o.y+1){
        player.y=o.y-player.h; player.vy=0; player.grounded=true;
        particles.spawn(player.x-camX+player.w/2, o.y, '#c77dff',4,0.5);
      } else if(player.mode==='ship' && wasFalling && prevBottom<=o.y+1){
        player.y=o.y-player.h; player.vy=0;
      } else if(player.mode==='ship' && !wasFalling && prevTop>=o.y+o.h-1){
        player.y=o.y+o.h; player.vy=0;
      } else { killPlayer(); return; }
    }
    if(o.type==='spike' && aabbOverlap(player, spikeHitbox(o))){ killPlayer(); return; }
    if(o.type==='pad' && aabbOverlap(player,o) && player.vy>=0){ player.vy=PAD_VELOCITY; player.grounded=false; AudioEngine.portal(); }
  }

  if(player.mode==='cube' && player.holdInput && player.grounded){ player.vy=JUMP_VELOCITY; player.grounded=false; AudioEngine.jump(); }
  if(player.mode==='cube' && player.grounded) player.rotation = Math.round(player.rotation/(Math.PI/2))*(Math.PI/2);

  player.trailTimer -= dt;
  if(player.trailTimer<=0){ particles.spawn(player.x-camX+player.w/2, player.y+player.h/2, player.mode==='ship'?'#f9c80e':player.skinColor, 1, 0.15); player.trailTimer=0.03; }
}

let best = 0;
try{ best = parseInt(localStorage.getItem('gd_best')||'0',10) || 0; }catch(e){}
document.getElementById('bestHud').textContent = best;
function distanceOf(x){ return Math.max(0, Math.floor((x-150)/40)); }

function killPlayer(){
  gameState='dead'; player.dead=true; AudioEngine.die();
  particles.spawn(player.x-camX+player.w/2, player.y+player.h/2, '#ff2e63', 25, 1.5);
  const score = distanceOf(player.x);
  if(score>best){ best=score; try{ localStorage.setItem('gd_best', String(best)); }catch(e){} }
  document.getElementById('bestHud').textContent = best;
  document.getElementById('deathMsg').textContent = `💀 GAME OVER — Distancia: ${score}m (récord: ${best}m)`;
  document.getElementById('deathOverlay').classList.remove('hidden');
  submitScore(currentPlayerName, score, player.skin, player.shape);
}
function resetGame(){
  player.x=150; player.y=groundY-SIZE; player.vy=0; player.rotation=0;
  player.dead=false; player.grounded=true; player.mode='cube'; player.holdInput=false;
  level.objects.length=0; furthestX=700; for(let i=0;i<6;i++) spawnChunk();
  attempts++; document.getElementById('attempts').textContent=attempts;
  document.getElementById('deathOverlay').classList.add('hidden');
  document.getElementById('winOverlay').classList.add('hidden');
  gameState='playing';
}
function startGame(){
  currentPlayerName = (nameInput.value.trim() || 'INVITADO').toUpperCase().slice(0,16);
  player.skin = selectedSkin;
  player.skinColor = (SKINS.find(s=>s.id===selectedSkin) || SKINS[0]).color;
  player.shape = selectedShape;
  savePrefs(currentPlayerName, selectedSkin, selectedShape);
  AudioEngine.unlock();
  AudioEngine.startMusic();
  document.getElementById('menuOverlay').classList.add('hidden');
  gameState='playing';
}
document.getElementById('muteBtn').onclick = ()=>{
  const m = AudioEngine.toggleMute();
  document.getElementById('muteBtn').textContent = m ? '🔇' : '🔊';
};

/* ============================================================
   INPUT
   ============================================================ */
function pressStart(){
  player.holdInput = true;
  if(player.mode==='cube' && player.grounded && gameState==='playing'){ player.vy=JUMP_VELOCITY; player.grounded=false; AudioEngine.jump(); }
}
function pressEnd(){ player.holdInput = false; }
window.addEventListener('keydown', e=>{
  if(document.activeElement===nameInput) return;
  if(e.code!=='Space') return; e.preventDefault();
  if(e.repeat) return; // ignorar auto-repetición del SO: el sostenido lo maneja holdInput, no keydown repetido
  if(gameState==='menu'){ startGame(); pressStart(); }
  else if(gameState==='dead') resetGame();
  else if(gameState==='win') resetGame();
  else pressStart();
});
window.addEventListener('keyup', e=>{ if(e.code==='Space') pressEnd(); });
canvas.addEventListener('mousedown', ()=>{
  if(gameState==='menu'){ startGame(); pressStart(); } else if(gameState==='playing') pressStart();
});
canvas.addEventListener('mouseup', pressEnd);
document.getElementById('startBtn').onclick = startGame;
document.getElementById('retryBtn').onclick = resetGame;
document.getElementById('againBtn').onclick = resetGame;
document.getElementById('menuFromDeathBtn').onclick = backToMenu;
document.getElementById('menuFromWinBtn').onclick = backToMenu;

/* ============================================================
   RENDER — paleta retro synthwave
   ============================================================ */
function playerShapePath(ctx, shapeId, w, h){
  const hw=w/2, hh=h/2;
  ctx.beginPath();
  if(shapeId==='circle'){ ctx.arc(0,0,hw,0,Math.PI*2); }
  else if(shapeId==='triangle'){ ctx.moveTo(0,-hh); ctx.lineTo(hw,hh); ctx.lineTo(-hw,hh); ctx.closePath(); }
  else if(shapeId==='diamond'){ ctx.moveTo(0,-hh); ctx.lineTo(hw,0); ctx.lineTo(0,hh); ctx.lineTo(-hw,0); ctx.closePath(); }
  else { ctx.rect(-hw,-hh,w,h); }
}
function drawGrid(){
  ctx.strokeStyle = `rgba(199,125,255,${0.35+beatFlash*0.5})`;
  const off = camX % 40;
  for(let x=-off; x<canvas.width; x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,groundY); ctx.stroke(); }
  const grad = ctx.createLinearGradient(0,groundY,0,canvas.height);
  grad.addColorStop(0,'#3a1c71'); grad.addColorStop(1,'#0d0221');
  ctx.fillStyle = grad; ctx.fillRect(0,groundY,canvas.width,canvas.height-groundY);
  ctx.strokeStyle='#ff2e63'; ctx.lineWidth=2+beatFlash*3; ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(canvas.width,groundY); ctx.stroke(); ctx.lineWidth=1;
}
function draw(){
  if(gameState==='playing' && AudioEngine.consumeBeat(AudioEngine.now())) beatFlash=1;
  beatFlash *= 0.88;
  ctx.fillStyle='#1a0b3d'; ctx.fillRect(0,0,canvas.width,canvas.height);
  drawGrid();
  for(const o of level.objects){
    const sx = o.x-camX;
    if(sx<-100||sx>canvas.width+100) continue;
    if(o.type==='block'){ ctx.fillStyle='#ff2e63'; ctx.fillRect(sx,o.y,o.w,o.h); ctx.strokeStyle='#ffffff55'; ctx.strokeRect(sx,o.y,o.w,o.h); }
    else if(o.type==='spike'){ ctx.fillStyle='#f9c80e'; ctx.beginPath(); ctx.moveTo(sx,o.y+o.h); ctx.lineTo(sx+o.w/2,o.y); ctx.lineTo(sx+o.w,o.y+o.h); ctx.closePath(); ctx.fill(); }
    else if(o.type==='pad'){ ctx.fillStyle='#f9c80e'; ctx.shadowColor='#f9c80e'; ctx.shadowBlur=8; ctx.fillRect(sx,o.y,o.w,o.h); ctx.shadowBlur=0; }
    else if(o.type==='portal_ship'||o.type==='portal_cube'){ ctx.fillStyle = o.type==='portal_ship'?'rgba(45,254,84,0.35)':'rgba(8,247,254,0.35)'; ctx.fillRect(sx,0,o.w,groundY); }
    else if(o.type==='goal'){ ctx.fillStyle='#2dfe54'; ctx.shadowColor='#2dfe54'; ctx.shadowBlur=12; ctx.fillRect(sx,o.y,o.w,o.h); ctx.shadowBlur=0; }
  }
  particles.draw(ctx, camX);

  const px=player.x-camX+player.w/2, py=player.y+player.h/2;
  ctx.save(); ctx.translate(px,py); ctx.rotate(player.rotation);
  const col = player.dead?'#555':(player.mode==='ship'?'#f9c80e':player.skinColor);
  ctx.shadowColor=col; ctx.shadowBlur=10+beatFlash*12;
  ctx.fillStyle=col;
  if(player.mode==='ship'){ ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h); }
  else { playerShapePath(ctx, player.shape, player.w, player.h); ctx.fill(); }
  ctx.shadowBlur=0; ctx.strokeStyle='#fff';
  if(player.mode==='ship'){ ctx.strokeRect(-player.w/2,-player.h/2,player.w,player.h); }
  else { playerShapePath(ctx, player.shape, player.w, player.h); ctx.stroke(); }
  ctx.restore();

  if(gameState==='playing') document.getElementById('dist').textContent = distanceOf(player.x);
}

/* ============================================================
   GAME LOOP — deltaTime + sub-stepping fijo (60/120/144Hz iguales)
   ============================================================ */
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
let lastTime = performance.now(), accumulator = 0;
function loop(now){
  let dt = (now-lastTime)/1000; lastTime = now;
  if(dt>MAX_DT) dt=MAX_DT;
  if(gameState==='playing'){
    accumulator += dt;
    while(accumulator>=FIXED_STEP){ physicsStep(FIXED_STEP); accumulator-=FIXED_STEP; }
    camX = player.x-150;
  }
  particles.update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
